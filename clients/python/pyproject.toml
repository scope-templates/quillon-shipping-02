[project]
name = "quillonpost"
version = "1.3.0"
description = "Python client library for the Quillon Post parcel API"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Quillon Post", email = "support@quillonpost.co.uk" }]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://quillonpost.co.uk"
Documentation = "https://quillonpost.co.uk/docs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quillonpost"]
